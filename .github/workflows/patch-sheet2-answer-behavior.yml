name: Patch Sheet2 answer behavior

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-sheet2-answer-behavior.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Patch formula engine to understand Sheet1!A1 and Sheet1!A1:B9.
          p = Path('src/utils/formulaEngine.js')
          s = p.read_text()
          start = s.index("const parseCellRef = (ref = '') => {")
          end = s.index("const splitArgs = (inner = '') => {")
          block = """const splitSheetRef = (ref = '') => {
  const clean = String(ref || '').trim().replace(/\\$/g, '');
  const bangIndex = clean.lastIndexOf('!');
  if (bangIndex === -1) return { sheetName: '', ref: clean };
  const sheetName = clean.slice(0, bangIndex).replace(/^'|'$/g, '').trim();
  return { sheetName, ref: clean.slice(bangIndex + 1) };
};

const sheetKey = (sheetName = '', ref = '') => {
  const sheet = String(sheetName || '').trim().toUpperCase();
  const cell = String(ref || '').replace(/\\$/g, '').toUpperCase();
  return sheet ? `${sheet}!${cell}` : cell;
};

const parseCellRef = (ref = '', defaultSheetName = '') => {
  const split = splitSheetRef(ref);
  const match = split.ref.toUpperCase().match(/^([A-Z]+)(\\d+)$/);
  if (!match) return null;
  const cleanRef = `${match[1]}${Number(match[2])}`;
  const sheetName = split.sheetName || defaultSheetName || '';
  return { sheetName, col: toColNumber(match[1]), row: Number(match[2]), ref: cleanRef, key: sheetKey(sheetName, cleanRef) };
};

const parseRangeRef = (ref = '', defaultSheetName = '') => {
  const parts = String(ref).replace(/\\$/g, '').split(':');
  const first = splitSheetRef(parts[0]);
  const start = parseCellRef(parts[0], defaultSheetName);
  const end = parseCellRef(parts[1] || parts[0], first.sheetName || defaultSheetName);
  if (!start || !end) return null;
  return {
    sheetName: start.sheetName || end.sheetName || defaultSheetName || '',
    startCol: Math.min(start.col, end.col),
    endCol: Math.max(start.col, end.col),
    startRow: Math.min(start.row, end.row),
    endRow: Math.max(start.row, end.row)
  };
};

const getTableSheets = (table = {}) => {
  if (Array.isArray(table.sheets) && table.sheets.length) {
    return table.sheets.map((sheet, index) => ({
      name: sheet.name || `Sheet${index + 1}`,
      columns: sheet.columns || [],
      rows: sheet.rows || []
    }));
  }
  return [{ name: table.sheetName || 'Sheet1', columns: table.columns || [], rows: table.rows || [] }];
};

const buildSheet = (table = {}) => {
  const values = new Map();
  const sheets = getTableSheets(table);
  const defaultSheetName = table.formulaSheetName || table.defaultSheetName || sheets[0]?.name || 'Sheet1';
  const setValue = (sheetName, ref, value) => {
    values.set(sheetKey(sheetName, ref), value);
    if (String(sheetName).toUpperCase() === String(defaultSheetName).toUpperCase()) values.set(String(ref).toUpperCase(), value);
  };
  sheets.forEach((sheet) => {
    const columns = sheet.columns || [];
    const rows = sheet.rows || [];
    columns.forEach((column, index) => setValue(sheet.name, `${toColName(index + 1)}1`, column));
    rows.forEach((row, rowIndex) => columns.forEach((_, colIndex) => setValue(sheet.name, `${toColName(colIndex + 1)}${rowIndex + 2}`, row[colIndex] ?? '')));
  });
  return { values, defaultSheetName };
};

const getCell = (sheet, ref) => {
  const cell = parseCellRef(ref, sheet?.defaultSheetName);
  if (!cell) throw new Error(ERROR_CODES.ref);
  return sheet.values.has(cell.key) ? sheet.values.get(cell.key) : '';
};

const getRange = (sheet, ref) => {
  const range = parseRangeRef(ref, sheet?.defaultSheetName);
  if (!range) throw new Error(ERROR_CODES.ref);
  const rows = [];
  for (let r = range.startRow; r <= range.endRow; r += 1) {
    const row = [];
    for (let c = range.startCol; c <= range.endCol; c += 1) row.push(sheet.values.get(sheetKey(range.sheetName, `${toColName(c)}${r}`)) ?? '');
    rows.push(row);
  }
  const prefix = range.sheetName ? `${range.sheetName}!` : '';
  return { __range: true, ref: `${prefix}${toColName(range.startCol)}${range.startRow}:${toColName(range.endCol)}${range.endRow}`, values: rows, rowCount: rows.length, colCount: rows[0]?.length || 0 };
};

"""
          s = s[:start] + block + s[end:]
          s = s.replace("/^\\$?[A-Z]+\\$?\\d+:\\$?[A-Z]+\\$?\\d+$/i", "/^(?:[^!]+!)?\\$?[A-Z]+\\$?\\d+:(?:[^!]+!)?\\$?[A-Z]+\\$?\\d+$/i")
          s = s.replace("/^\\$?[A-Z]+\\$?\\d+$/i", "/^(?:[^!]+!)?\\$?[A-Z]+\\$?\\d+$/i")
          p.write_text(s)

          # Patch ExerciseTable: Sheet2 can be answer sheet, Sheet1 selections insert Sheet1!range.
          p = Path('src/components/ExerciseTable.jsx')
          s = p.read_text()
          s = s.replace("selectable: false", "selectable: table?.questionSheetSelectable === true")
          s = s.replace("const [activeSheetId, setActiveSheetId] = useState('sheet1');", "const [activeSheetId, setActiveSheetId] = useState(table?.activeSheetId || 'sheet1');")
          s = s.replace("const canSelect = Boolean(activeSheet.selectable);", "const canSelect = Boolean(activeSheet.selectable);\n  const formulaSheetId = table?.formulaSheetId || table?.answerSheetId || 'sheet1';\n  const isAnswerSheet = activeSheet.id === formulaSheetId;\n  const cleanSheet = (value = '') => String(value).replace(/^'|'$/g, '');\n  const visibleRanges = highlightRanges.map((range) => {\n    const text = String(range || '');\n    if (!text.includes('!')) return isAnswerSheet ? text : '';\n    const [sheetName, ref] = text.split('!');\n    return cleanSheet(sheetName) === activeSheet.name ? ref : '';\n  }).filter(Boolean);\n  const formatRangeForFormula = (range) => activeSheet.id === formulaSheetId ? range : `${activeSheet.name}!${range}`;")
          s = s.replace("const isHighlighted = (ref) => canSelect && highlightRanges.some((range) => inRange(ref, range));", "const isHighlighted = (ref) => canSelect && visibleRanges.some((range) => inRange(ref, range));")
          s = s.replace("const resetSelection = () => {", "useEffect(() => {\n    setActiveSheetId(table?.activeSheetId || 'sheet1');\n  }, [table]);\n\n  const resetSelection = () => {")
          s = s.replace("onRangeSelected?.(finalRange);", "onRangeSelected?.(formatRangeForFormula(finalRange));")
          s = s.replace("{canSelect ? 'Klik/drag cell, header kolom, atau nomor baris' : 'Sheet soal hanya untuk dibaca'}", "{canSelect ? (isAnswerSheet ? 'Sheet hasil: tulis rumus di cell aktif' : 'Sheet data: pilih range untuk rumus') : 'Sheet ini hanya untuk dibaca'}")
          s = s.replace("value={canSelect ? (cellValues[ref] ?? column) : column}", "value={isAnswerSheet ? (cellValues[ref] ?? column) : column}")
          s = s.replace("value={canSelect ? (cellValues[ref] ?? row[colIndex]) : row[colIndex]}", "value={isAnswerSheet ? (cellValues[ref] ?? row[colIndex]) : row[colIndex]}")
          s = s.replace("active={canSelect && activeCell === ref}", "active={canSelect && isAnswerSheet && activeCell === ref}")
          p.write_text(s)

          Path('.github/workflows/patch-sheet2-answer-behavior.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name chatgpt-fix-bot
          git config user.email github-actions[bot]@users.noreply.github.com
          git add src/utils/formulaEngine.js src/components/ExerciseTable.jsx .github/workflows/patch-sheet2-answer-behavior.yml
          git commit -m "Support Sheet2 as answer area"
          git push origin main
