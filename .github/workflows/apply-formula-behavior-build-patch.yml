name: Apply formula behavior build patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-formula-behavior-build-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch package scripts
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          path = Path('package.json')
          data = json.loads(path.read_text())
          data.setdefault('scripts', {})
          data['scripts']['dev'] = 'node scripts/patch-formula-behavior.mjs && vite'
          data['scripts']['build'] = 'node scripts/patch-formula-behavior.mjs && vite build'
          data['scripts']['preview'] = 'vite preview'
          path.write_text(json.dumps(data, indent=2) + '\n')
          Path('.github/workflows/apply-formula-behavior-build-patch.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "chatgpt-fix-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/apply-formula-behavior-build-patch.yml
          git commit -m "Run formula behavior patch before build"
          git push origin main
