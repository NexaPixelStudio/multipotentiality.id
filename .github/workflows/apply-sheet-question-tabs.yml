name: Apply sheet question tabs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-sheet-question-tabs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch question sheet data
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Patch Batch 01
          p = Path('src/data/quality/batch01BasicCalculation.js')
          text = p.read_text()
          if 'function buildQuestionSheet' not in text:
            text = text.replace(
              "function idSeparator(formula = '') {\n  return formula.replace(/,/g, ';');\n}\n\nfunction buildExercise",
              "function idSeparator(formula = '') {\n  return formula.replace(/,/g, ';');\n}\n\nfunction buildQuestionSheet({ title, question, activeCell, formulaName, criteriaValue, ranges, logic }) {\n  return {\n    title: 'Sheet 2 - Soal',\n    description: 'Sheet ini berisi soal latihan. Sheet 1 tetap dipakai sebagai data utama.',\n    columns: ['Bagian', 'Isi'],\n    rows: [\n      ['Judul Latihan', title],\n      ['Soal', question],\n      ['Cell Jawaban', activeCell],\n      ['Rumus yang Dipakai', formulaName],\n      ['Value / Kriteria', criteriaValue || 'Tidak ada value khusus.'],\n      ['Range yang Dipakai', ranges?.length ? ranges.join(', ') : 'Ikuti soal dan data di Sheet 1.'],\n      ['Cara Baca', logic]\n    ]\n  };\n}\n\nfunction buildExercise"
            )
          if "const question = plan.buildQuestion(context);" not in text:
            text = text.replace(
              "  const label = typeof plan.label === 'function' ? plan.label({ order }) : plan.label;\n  const context = { product, row, order, range };\n\n  return {",
              "  const label = typeof plan.label === 'function' ? plan.label({ order }) : plan.label;\n  const context = { product, row, order, range };\n  const question = plan.buildQuestion(context);\n  const logicPrompt = plan.buildLogic(context);\n  const criteriaValue = ['LARGE', 'SMALL'].includes(plan.name) ? String(order) : '';\n  const title = `Latihan ${rowIndex + 1}: ${label}`;\n\n  return {"
            )
            text = text.replace("    title: `Latihan ${rowIndex + 1}: ${label}`,", "    title,")
            text = text.replace("    table: batchBasicSalesTable,", "    table: { ...batchBasicSalesTable, questionSheet: buildQuestionSheet({ title, question, activeCell: `J${row}`, formulaName: plan.name, criteriaValue, ranges: [range], logic: logicPrompt }) },")
            text = text.replace("    question: plan.buildQuestion(context),", "    question,")
            text = text.replace("    logicPrompt: plan.buildLogic(context),", "    logicPrompt,")
            text = text.replace("    criteriaValue: ['LARGE', 'SMALL'].includes(plan.name) ? String(order) : '',", "    criteriaValue,")
          p.write_text(text)

          # Patch Batch 02
          p = Path('src/data/quality/batch02ConditionalCalculation.js')
          text = p.read_text()
          if 'function buildQuestionSheet' not in text:
            text = text.replace(
              "function getCommonMistakes(formulaId) {",
              "function buildQuestionSheet({ title, question, activeCell, formulaName, criteriaValue, ranges, logic }) {\n  return {\n    title: 'Sheet 2 - Soal',\n    description: 'Sheet ini berisi soal latihan. Sheet 1 tetap dipakai sebagai data utama.',\n    columns: ['Bagian', 'Isi'],\n    rows: [\n      ['Judul Latihan', title],\n      ['Soal', question],\n      ['Cell Jawaban', activeCell],\n      ['Rumus yang Dipakai', formulaName],\n      ['Value / Kriteria', criteriaValue || 'Tidak ada value khusus.'],\n      ['Range yang Dipakai', ranges?.length ? ranges.join(', ') : 'Ikuti soal dan data di Sheet 1.'],\n      ['Cara Baca', logic]\n    ]\n  };\n}\n\nfunction getCommonMistakes(formulaId) {"
            )
          if "const question = `Di cell ${scenario.activeCell}, ${scenario.task}.`;" not in text:
            text = text.replace(
              "  const conditionText = multi\n    ? scenario.criteriaPairs.map(([range, criteria]) => `${range} = ${criteria}`).join(' dan ')\n    : `${scenario.criteriaRange} = ${scenario.criteriaText}`;\n\n  return {",
              "  const conditionText = multi\n    ? scenario.criteriaPairs.map(([range, criteria]) => `${range} = ${criteria}`).join(' dan ')\n    : `${scenario.criteriaRange} = ${scenario.criteriaText}`;\n  const question = `Di cell ${scenario.activeCell}, ${scenario.task}.`;\n  const logicPrompt = `${meta.name} dipakai untuk mencari ${meta.resultWord} dengan ${multi ? 'lebih dari satu syarat' : 'satu syarat'}. Cara bacanya: cek ${conditionText}, lalu ${meta.resultWord} diambil dari data yang memenuhi syarat.`;\n  const ranges = getHighlightRanges(scenario);\n  const criteriaValue = getCriteriaValue(scenario);\n  const title = `Latihan ${index + 1}: ${scenario.label}`;\n\n  return {"
            )
            text = text.replace("    title: `Latihan ${index + 1}: ${scenario.label}`,", "    title,")
            text = text.replace("    table: batchConditionalOrderTable,", "    table: { ...batchConditionalOrderTable, questionSheet: buildQuestionSheet({ title, question, activeCell: scenario.activeCell, formulaName: meta.name, criteriaValue, ranges, logic: logicPrompt }) },")
            text = text.replace("    question: `Di cell ${scenario.activeCell}, ${scenario.task}.`,", "    question,")
            text = text.replace("    logicPrompt: `${meta.name} dipakai untuk mencari ${meta.resultWord} dengan ${multi ? 'lebih dari satu syarat' : 'satu syarat'}. Cara bacanya: cek ${conditionText}, lalu ${meta.resultWord} diambil dari data yang memenuhi syarat.`,", "    logicPrompt,")
            text = text.replace("    requiredRefs: getHighlightRanges(scenario),", "    requiredRefs: ranges,")
            text = text.replace("    criteriaValue: getCriteriaValue(scenario),", "    criteriaValue,")
            text = text.replace("    highlightRanges: getHighlightRanges(scenario),", "    highlightRanges: ranges,")
            text = text.replace("      refs: getHighlightRanges(scenario),", "      refs: ranges,")
          p.write_text(text)

          Path('.github/workflows/apply-sheet-question-tabs.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "chatgpt-fix-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/quality/batch01BasicCalculation.js src/data/quality/batch02ConditionalCalculation.js .github/workflows/apply-sheet-question-tabs.yml
          git commit -m "Add question content to Sheet 2"
          git push origin main
