name: Apply IF status table fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-if-status-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch source files
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          factory_path = Path('src/data/formulaPracticeFactory.js')
          factory = factory_path.read_text()

          rows_old = """const ifPracticeRows = [
            ['Agus', 75, 90, 'Lunas', ''],
            ['Sinta', 88, 95, 'Lunas', ''],
            ['Budi', 65, 80, 'Belum', ''],
            ['Nadia', 92, 98, 'Lunas', ''],
            ['Raka', 70, 60, 'Belum', ''],
            ['Maya', 84, 72, 'Lunas', '']
          ];"""
          rows_new = """const ifPracticeRows = [
            ['Agus', 75, 'Laki-laki', ''],
            ['Sinta', 88, 'Perempuan', ''],
            ['Budi', 65, 'Laki-laki', ''],
            ['Nadia', 92, 'Perempuan', ''],
            ['Raka', 70, 'Laki-laki', ''],
            ['Maya', 84, 'Perempuan', '']
          ];"""
          factory = factory.replace(rows_old, rows_new)

          replacements = {
            "activeCell: 'E2'": "activeCell: 'D2'",
            "activeCell: 'E3'": "activeCell: 'D3'",
            "activeCell: 'E4'": "activeCell: 'D4'",
            "activeCell: 'E5'": "activeCell: 'D5'",
            "activeCell: 'E6'": "activeCell: 'D6'",
            "activeCell: 'E7'": "activeCell: 'D7'",
            "sourceCell: 'C4'": "sourceCell: 'B4'",
            "sourceCell: 'D5'": "sourceCell: 'B5'",
            "sourceCell: 'C7'": "sourceCell: 'B7'",
            "conditionText: 'Kehadiran Budi di C4 lebih besar atau sama dengan 80'": "conditionText: 'Nilai Budi di B4 lebih besar atau sama dengan 75'",
            "criteriaValue: '80'": "criteriaValue: '75'",
            "trueResult: 'Hadir Baik'": "trueResult: 'Lulus'",
            "falseResult: 'Kurang Hadir'": "falseResult: 'Tidak Lulus'",
            "expectedFormula: '=IF(C4>=80,\"Hadir Baik\",\"Kurang Hadir\")'": "expectedFormula: '=IF(B4>=75,\"Lulus\",\"Tidak Lulus\")'",
            "question: 'Di cell E4, buat status Budi: jika Kehadiran di C4 >= 80 maka hasilnya Hadir Baik, jika tidak maka Kurang Hadir.'": "question: 'Di cell D4, buat Status Budi: jika Nilai di B4 >= 75 maka hasilnya Lulus, jika tidak maka Tidak Lulus.'",
            "label: 'Kehadiran'": "label: 'Belum Lulus'",
            "label: 'Pembayaran'": "label: 'Perlu Apresiasi'",
            "conditionText: 'Pembayaran Nadia di D5 sama dengan Lunas'": "conditionText: 'Nilai Nadia di B5 lebih besar atau sama dengan 90'",
            "criteriaValue: 'Lunas'": "criteriaValue: '90'",
            "trueResult: 'Boleh Ikut'": "trueResult: 'Apresiasi'",
            "falseResult: 'Tahan Dulu'": "falseResult: 'Standar'",
            "expectedFormula: '=IF(D5=\"Lunas\",\"Boleh Ikut\",\"Tahan Dulu\")'": "expectedFormula: '=IF(B5>=90,\"Apresiasi\",\"Standar\")'",
            "question: 'Di cell E5, buat status Nadia: jika Pembayaran di D5 = Lunas maka hasilnya Boleh Ikut, jika tidak maka Tahan Dulu.'": "question: 'Di cell D5, buat Status Nadia: jika Nilai di B5 >= 90 maka hasilnya Apresiasi, jika tidak maka Standar.'",
            "question: 'Di cell E2, buat status Agus": "question: 'Di cell D2, buat Status Agus",
            "question: 'Di cell E3, buat status Sinta": "question: 'Di cell D3, buat Status Sinta",
            "question: 'Di cell E6, buat status Raka": "question: 'Di cell D6, buat Status Raka",
            "conditionText: 'Kehadiran Maya di C7 lebih kecil dari 75'": "conditionText: 'Nilai Maya di B7 lebih besar atau sama dengan 75'",
            "trueResult: 'Follow Up'": "trueResult: 'Lulus'",
            "falseResult: 'Aman'": "falseResult: 'Tidak Lulus'",
            "expectedFormula: '=IF(C7<75,\"Follow Up\",\"Aman\")'": "expectedFormula: '=IF(B7>=75,\"Lulus\",\"Tidak Lulus\")'",
            "question: 'Di cell E7, buat status Maya: jika Kehadiran di C7 < 75 maka hasilnya Follow Up, jika tidak maka Aman.'": "question: 'Di cell D7, buat Status Maya: jika Nilai di B7 >= 75 maka hasilnya Lulus, jika tidak maka Tidak Lulus.'",
            "label: 'Follow Up'": "label: 'Status Kelulusan'",
            "description: 'Pakai kolom B, C, atau D sebagai kondisi. Kolom E adalah tempat menulis hasil IF sesuai baris yang diminta soal.'": "description: 'Kolom D adalah tempat hasil rumus IF. Pakai kolom B sebagai kondisi nilai, lalu hasilnya masuk ke kolom Status sesuai baris yang diminta soal.'",
            "columns: ['Nama', 'Nilai', 'Kehadiran', 'Pembayaran', 'Hasil IF']": "columns: ['Nama', 'Nilai', 'Jenis Kelamin', 'Status']"
          }
          for old, new in replacements.items():
            factory = factory.replace(old, new)
          factory_path.write_text(factory)

          app_path = Path('src/App.jsx')
          app = app_path.read_text()
          formula_block = """  const formulaResult = useMemo(() => {
            if (!answer.trim()) return null;
            return evaluateFormula(answer, table, progressState.separatorMode);
          }, [answer, progressState.separatorMode, table]);
          """
          live_block = formula_block + """
          const liveCellValues = useMemo(() => {
            const targetCell = exercise?.activeCell || activeCell;
            if (!answer.trim() || !targetCell || !formulaResult) return {};
            return {
              [String(targetCell).toUpperCase()]: formulaResult.displayValue ?? formulaResult.value ?? ''
            };
          }, [activeCell, answer, exercise?.activeCell, formulaResult]);
          """
          if 'const liveCellValues = useMemo' not in app:
            if formula_block not in app:
              raise SystemExit('formulaResult block not found')
            app = app.replace(formula_block, live_block, 1)
          app = app.replace('            activeCell={activeCell}\n            selectedRange={selectedRange}\n', '            activeCell={exercise?.activeCell || activeCell}\n            cellValues={liveCellValues}\n            selectedRange={selectedRange}\n', 1)
          app_path.write_text(app)

          table_path = Path('src/components/ExerciseTable.jsx')
          table = table_path.read_text()
          table = re.sub(r"export default function ExerciseTable\(\{ table, highlightRanges = \[\], activeCell, (?:cellValues = \{\}, )?onCellClick, onRangeSelected \}\)", "export default function ExerciseTable({ table, highlightRanges = [], activeCell, cellValues = {}, onCellClick, onRangeSelected })", table, count=1)
          table = table.replace('value={column}', 'value={cellValues[ref] ?? column}', 1)
          table = table.replace('value={row[colIndex]}', 'value={cellValues[ref] ?? row[colIndex]}', 1)
          table_path.write_text(table)

          Path('.github/workflows/apply-if-status-fix.yml').unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build check
        run: npm run build
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "chatgpt-fix-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/ExerciseTable.jsx src/data/formulaPracticeFactory.js .github/workflows/apply-if-status-fix.yml
          git commit -m "Fix IF practice status table"
          git push origin main
