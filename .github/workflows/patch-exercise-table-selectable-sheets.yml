name: Keep Sheet2 result layout selectable

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-exercise-table-selectable-sheets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only selectable behavior
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/ExerciseTable.jsx')
          s = p.read_text()

          s = s.replace("selectable: false", "selectable: table?.questionSheetSelectable === true")
          s = s.replace("const [activeSheetId, setActiveSheetId] = useState('sheet1');", "const [activeSheetId, setActiveSheetId] = useState(table?.activeSheetId || 'sheet1');")

          old = """  const canSelect = Boolean(activeSheet.selectable);

  const [selectionStart, setSelectionStart] = useState(null);"""
          new = """  const canSelect = Boolean(activeSheet.selectable);
  const formulaSheetId = table?.formulaSheetId || table?.answerSheetId || 'sheet1';
  const isAnswerSheet = activeSheetId === formulaSheetId || sheets.length === 1;

  const [selectionStart, setSelectionStart] = useState(null);"""
          s = s.replace(old, new)

          s = s.replace("const displayActiveCell = canSelect ? (activeCell || 'A1') : `${activeSheet.name}`;", "const displayActiveCell = canSelect ? (isAnswerSheet ? (activeCell || 'A1') : activeSheet.name) : `${activeSheet.name}`;")

          old = """  const handleSheetChange = (sheetId) => {
    setActiveSheetId(sheetId);
    resetSelection();
  };"""
          new = """  const handleSheetChange = (sheetId) => {
    setActiveSheetId(sheetId);
    resetSelection();
  };

  const formatRangeForFormula = (range) => {
    if (!range) return range;
    if (isAnswerSheet || sheets.length === 1) return range;
    return `${activeSheet.name}!${range}`;
  };"""
          s = s.replace(old, new)

          s = s.replace("onRangeSelected?.(finalRange);", "onRangeSelected?.(formatRangeForFormula(finalRange));")
          s = s.replace("{canSelect ? 'Klik/drag cell, header kolom, atau nomor baris' : 'Sheet soal hanya untuk dibaca'}", "{canSelect ? (isAnswerSheet ? 'Klik cell untuk target hasil, rumus tetap diketik di formula bar' : 'Klik/drag cell, header kolom, atau nomor baris') : 'Sheet ini hanya untuk dibaca'}")
          s = s.replace("value={canSelect ? (cellValues[ref] ?? column) : column}", "value={isAnswerSheet ? (cellValues[ref] ?? column) : column}")
          s = s.replace("value={canSelect ? (cellValues[ref] ?? row[colIndex]) : row[colIndex]}", "value={isAnswerSheet ? (cellValues[ref] ?? row[colIndex]) : row[colIndex]}")
          s = s.replace("active={canSelect && activeCell === ref}", "active={canSelect && isAnswerSheet && activeCell === ref}")

          p.write_text(s)
          Path('.github/workflows/patch-exercise-table-selectable-sheets.yml').unlink(missing_ok=True)
          PY
      - name: Build check
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "chatgpt-fix-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/ExerciseTable.jsx .github/workflows/patch-exercise-table-selectable-sheets.yml
          git commit -m "Keep Sheet2 result layout selectable"
          git push origin main
