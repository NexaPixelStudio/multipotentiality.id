name: Patch formula sheet refs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-formula-sheet-refs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch formula engine
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/utils/formulaEngine.js')
          s = p.read_text()
          s = s.replace("if (/^\\$?[A-Z]+\\$?\\d+:\\$?[A-Z]+\\$?\\d+$/i.test(raw)) return getRange(ctx.sheet, raw);", "if (/^(?:[^!]+!)?\\$?[A-Z]+\\$?\\d+:(?:[^!]+!)?\\$?[A-Z]+\\$?\\d+$/i.test(raw)) return getRange(ctx.sheet, raw);")
          s = s.replace("if (/^\\$?[A-Z]+\\$?\\d+$/i.test(raw)) return getCell(ctx.sheet, raw);", "if (/^(?:[^!]+!)?\\$?[A-Z]+\\$?\\d+$/i.test(raw)) return getCell(ctx.sheet, raw);")
          p.write_text(s)
          Path('.github/workflows/patch-formula-sheet-refs.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name chatgpt-fix-bot
          git config user.email github-actions[bot]@users.noreply.github.com
          git add src/utils/formulaEngine.js .github/workflows/patch-formula-sheet-refs.yml
          git commit -m "Support sheet reference detection" || exit 0
          git push origin main
