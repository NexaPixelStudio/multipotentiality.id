name: Hide question helper pills

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hide-question-helper-pills.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable helper value pills
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace(
            "const showQuestionHelper = modeConfig.showValueHelper && questionHelperValues.length > 0;",
            "const showQuestionHelper = false;"
          )
          p.write_text(s)
          Path('.github/workflows/hide-question-helper-pills.yml').unlink(missing_ok=True)
          PY
      - name: Build check
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "chatgpt-fix-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/hide-question-helper-pills.yml
          git commit -m "Hide formula helper value pills"
          git push origin main
